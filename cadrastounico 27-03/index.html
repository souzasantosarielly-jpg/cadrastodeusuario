<!DOCTYPE html>
<html lang="pr-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cadrasto de usuarios</title>
   <style>
    body {background-color: rgb(183, 112, 250);
        font-family: Arial, Helvetica, sans-serif;
        margin: 0;
        text-align: center;

    }
    div{
        margin-bottom: 15px;
    }
    label{
        display:inline-block;
        width: 150px;

    }

    
   </style>
        
    
    </body>
    
</head>
<body>
    <h2>cadrastro completo de usuarios</h2>
    <form action="">
        <div>
            <label for="nome">Nome: </label>
                <input type="text" name="nome" id="nome" placeholder="digite seu nome">
        </div>

    <div>
        <label for="email">E-mail:</label>
        <input type="email" name="email" id="email" placeholder="digite seu email" required>
    </div>

    <div>
        <label for="senha">Senha</label>
        <input type="password" name="senha" id="senha" placeholder="digite sua senha">
        
    </div>
<div>
    <label for="tel">telefone: </label>
    <input type="tel" name="tel" id="tel" placeholder="(44)9145-6789">

</div>
<label for="nasc">data de nascimento</label>
<input type="date" name="nasc" id="nasc">
</div>
<div>
    <label for="Genêro">Gênero</label>
    <input type="radio" name="Genêro" id="fem" value="femenino">
    <label for="fem">femenino</label>
    <input type="radio" name="Genêro" value="masculino">
    <label for="Genêro">masculino</label>
    <div>
        <button type="submit">cadrastar</button>

    </div>

    
</div>


    </form>
</body>
</html>
